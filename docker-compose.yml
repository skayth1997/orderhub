services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # A second database server, only for the inventory app.
  inventory-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
      POSTGRES_DB: ${INVENTORY_DB_NAME}
    ports:
      - "${INVENTORY_DB_PORT}:5432"
    volumes:
      - inventorydata:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodata:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "15672:15672"

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
    ports:
      - "${LOCALSTACK_PORT}:4566"

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT}:6379"

  kafka:
    image: apache/kafka:3.9.0
    environment:
      # This one node is both the broker (stores messages) and the controller
      # (manages the cluster). That is KRaft mode, so no ZooKeeper is needed.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Three "doors" into Kafka: HOST (your app on your Mac), DOCKER (other
      # containers, like the UI) and CONTROLLER (Kafka talking to itself).
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      # With only one node, internal topics cannot have more than 1 copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # New topics get 3 partitions by default (handy for learning).
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data

  # Runs once, creates the topics our apps use, then stops. Creating them here
  # means the apps never start before their topics exist.
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      - kafka
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list; do sleep 2; done
        for topic in orders.events orders.events.dlq stock.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1
        done

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports:
      - "8080:8080"

  adminer:
    image: adminer:4
    depends_on:
      - postgres
      - inventory-db
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT}:8080"

  mongo-express:
    image: mongo-express:1.0.2
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"

  redisinsight:
    image: redis/redisinsight:2.60
    depends_on:
      - redis
    ports:
      - "${REDISINSIGHT_PORT}:5540"
    volumes:
      - redisinsightdata:/data

volumes:
  pgdata:
  inventorydata:
  kafkadata:
  mongodata:
  redisinsightdata:
