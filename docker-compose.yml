services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: orderhub
      POSTGRES_PASSWORD: orderhub
      POSTGRES_DB: orderhub
    ports:
      - "54320:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # A second database server, only for the inventory app.
  inventory-db:
    image: postgres:16
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "54321:5432"
    volumes:
      - inventorydata:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.0
    environment:
      # This one node is both the broker (stores messages) and the controller
      # (manages the cluster). That is KRaft mode, so no ZooKeeper is needed.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Three "doors" into Kafka: HOST (your app on your Mac), DOCKER (other
      # containers, like the UI) and CONTROLLER (Kafka talking to itself).
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      # With only one node, internal topics cannot have more than 1 copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # New topics get 3 partitions by default (handy for learning).
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data

  # Runs once, creates the topics our apps use, then stops. Creating them here
  # means the apps never start before their topics exist.
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      - kafka
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list; do sleep 2; done
        for topic in orders.events stock.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1
        done

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports:
      - "8080:8080"

volumes:
  pgdata:
  inventorydata:
  kafkadata:
